<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Contador de Pessoas - BeiQi-S10</title>
  <style>
    :root {
      --bg: #0f172a;
      --card: #1e293b;
      --text: #f8fafc;
      --muted: #94a3b8;
      --primary: #22c55e;
      --primary-hover: #16a34a;
      --danger: #ef4444;
      --danger-hover: #dc2626;
      --secondary: #334155;
    }

    * { box-sizing: border-box; font-family: system-ui, -apple-system, sans-serif; }
    body {
      margin: 0;
      min-height: 100vh;
      background: var(--bg);
      color: var(--text);
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 16px;
    }

    .container {
      width: 100%;
      max-width: 420px;
      background: var(--card);
      border-radius: 16px;
      padding: 24px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.35);
      text-align: center;
    }

    h1 { font-size: 1.25rem; margin: 0 0 8px; }
    .status {
      font-size: 0.875rem;
      color: var(--muted);
      margin-bottom: 24px;
    }
    .status.connected { color: var(--primary); font-weight: 600; }

    .counter-box {
      background: rgba(15, 23, 42, 0.6);
      border-radius: 12px;
      padding: 24px 16px;
      margin-bottom: 20px;
    }

    .counter-label {
      font-size: 0.85rem;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--muted);
    }

    .counter-value {
      font-size: 4.5rem;
      font-weight: 800;
      line-height: 1.1;
      margin: 8px 0;
      color: var(--primary);
    }

    .ring-raw {
      font-size: 0.8rem;
      color: var(--muted);
    }

    .actions {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    button {
      border: none;
      border-radius: 10px;
      padding: 12px 16px;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      color: white;
      transition: background 0.15s ease;
    }

    .btn-connect {
      grid-column: span 2;
      background: var(--primary);
    }
    .btn-connect:hover { background: var(--primary-hover); }

    .btn-reset { background: var(--danger); }
    .btn-reset:hover { background: var(--danger-hover); }

    .btn-manual { background: var(--secondary); }
    .btn-manual:hover { background: #475569; }

    .log-box {
      margin-top: 20px;
      text-align: left;
      max-height: 150px;
      overflow-y: auto;
      background: rgba(15, 23, 42, 0.45);
      border-radius: 10px;
      padding: 10px 12px;
      font-size: 0.82rem;
      color: var(--muted);
    }
    .log-box div { padding: 3px 0; border-bottom: 1px solid rgba(255,255,255,0.05); }
  </style>
</head>
<body>
  <div class="container">
    <h1>Contagem de Pessoas</h1>
    <div id="status" class="status">Desconectado do BeiQi-S10</div>

    <div class="counter-box">
      <div class="counter-label">Total na Sessão</div>
      <div id="displayCount" class="counter-value">0</div>
      <div id="ringRaw" class="ring-raw">Visor do anel: —</div>
    </div>

    <div class="actions">
      <button id="btnConnect" class="btn-connect">Conectar BeiQi-S10</button>
      <button id="btnManual" class="btn-manual">+1 Manual</button>
      <button id="btnReset" class="btn-reset">Zerar Contador</button>
    </div>

    <div id="logBox" class="log-box">
      <div>Aguardando conexão Bluetooth...</div>
    </div>
  </div>

  <script>
    const SERVICE_UUID = 0x1815; // Automation IO
    const CHAR_UUID = 0x2A56;    // Digital

    let totalPessoas = 0;
    let ultimoValorAnel = null;
    let bluetoothDevice = null;

    const displayCount = document.getElementById('displayCount');
    const ringRaw = document.getElementById('ringRaw');
    const statusEl = document.getElementById('status');
    const logBox = document.getElementById('logBox');

    function addLog(msg) {
      const hora = new Date().toLocaleTimeString('pt-BR');
      const item = document.createElement('div');
      item.textContent = `[${hora}] ${msg}`;
      logBox.prepend(item);
    }

    function atualizarTela() {
      displayCount.textContent = totalPessoas;
    }

    function processarLeituraAnel(novoValor) {
      ringRaw.textContent = `Visor do anel: ${novoValor}`;

      // Primeira leitura após conectar: apenas sincroniza a referência
      if (ultimoValorAnel === null) {
        ultimoValorAnel = novoValor;
        addLog(`Sincronizado com o anel (valor atual: ${novoValor})`);
        return;
      }

      if (novoValor > ultimoValorAnel) {
        const incremento = novoValor - ultimoValorAnel;
        totalPessoas += incremento;
        atualizarTela();
        addLog(`+${incremento} pessoa(s) | Total: ${totalPessoas}`);
      } else if (novoValor === 0 && ultimoValorAnel > 0) {
        // O botão físico de reset do anel foi acionado
        addLog('Anel zerado fisicamente (total da página mantido)');
      }

      ultimoValorAnel = novoValor;
    }

    function handleCharacteristicChanged(event) {
      const value = event.target.value;
      const bytes = new Uint8Array(value.buffer);

      // Valida cabeçalho (0x06, 0x0C) e tamanho mínimo do pacote
      if (bytes.length < 15 || bytes[0] !== 0x06 || bytes[1] !== 0x0C) return;

      // Valida checksum XOR dos bytes 0..13 contra o byte 14
      let xor = 0;
      for (let i = 0; i < 14; i++) {
        xor ^= bytes[i];
      }
      if (xor !== bytes[14]) return;

      const contadorAtual = (bytes[2] << 16) | (bytes[3] << 8) | bytes[4];
      processarLeituraAnel(contadorAtual);
    }

    document.getElementById('btnConnect').addEventListener('click', async () => {
      try {
        statusEl.textContent = 'Procurando BeiQi-S10...';
        bluetoothDevice = await navigator.bluetooth.requestDevice({
          filters: [{ namePrefix: 'BeiQi' }],
          optionalServices: [SERVICE_UUID]
        });

        bluetoothDevice.addEventListener('gattserverdisconnected', () => {
          statusEl.textContent = 'Desconectado';
          statusEl.classList.remove('connected');
          ultimoValorAnel = null;
          addLog('Dispositivo desconectado.');
        });

        const server = await bluetoothDevice.gatt.connect();
        const service = await server.getPrimaryService(SERVICE_UUID);
        const characteristic = await service.getCharacteristic(CHAR_UUID);

        await characteristic.startNotifications();
        characteristic.addEventListener('characteristicvaluechanged', handleCharacteristicChanged);

        statusEl.textContent = `Conectado: ${bluetoothDevice.name}`;
        statusEl.classList.add('connected');
        addLog('Conectado e escutando cliques.');
      } catch (err) {
        statusEl.textContent = 'Falha ou cancelado';
        addLog(`Erro: ${err.message}`);
      }
    });

    // Botão para zerar a contagem da sessão na página
    document.getElementById('btnReset').addEventListener('click', () => {
      if (totalPessoas === 0) return;
      if (confirm('Deseja zerar o contador da sessão atual?')) {
        totalPessoas = 0;
        atualizarTela();
        logBox.innerHTML = '';
        addLog('Contador zerado na página.');
      }
    });

    // Botão auxiliar para ajuste manual (+1) caso necessário
    document.getElementById('btnManual').addEventListener('click', () => {
      totalPessoas += 1;
      atualizarTela();
      addLog(`+1 manual | Total: ${totalPessoas}`);
    });
  </script>
</body>
</html>
